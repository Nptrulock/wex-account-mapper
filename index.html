<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; manifest-src 'self'; worker-src 'self'; connect-src https://wexinc.my.salesforce.com https://login.salesforce.com https://test.salesforce.com https://*.force.com; form-action 'none'; base-uri 'none'; object-src 'none'; frame-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e3a5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Account Mapper">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Account Mapper — local, private</title>
<style>:root{
  --bg:#f4f6f8;--panel:#fff;--ink:#1f2937;--muted:#6b7280;--line:#cbd5e1;--border:#e2e8f0;
  --brand:#1e3a5f;--brand2:#2f5d8a;--accent:#c2410c;
  --st-app:#d97706;--st-app-bg:#fef3c7;--st-impl:#2563eb;--st-impl-bg:#dbeafe;--st-mc:#059669;--st-mc-bg:#d1fae5;
  --own:#7c3aed;--own-bg:#ede9fe;--up:#475569;--up-bg:#f1f5f9;
  --radius:10px;--shadow:0 1px 2px rgba(15,23,42,.06),0 2px 8px rgba(15,23,42,.06);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--border);background:#fff;border-radius:8px;padding:7px 12px;min-height:34px}
button:hover{background:#f8fafc;border-color:#cbd5e1}
button.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
button.primary:hover{background:var(--brand2)}
button.ghost{background:transparent;border-color:transparent}
button.small{padding:3px 8px;min-height:26px;font-size:12px}
button.danger{color:#b91c1c;border-color:#fecaca}
button.cp{padding:2px 6px;min-height:26px;font-size:12px;color:var(--muted);background:#fff}
button.cp:hover{color:var(--brand)}
input[type=password],input[type=text],input[type=email],input[type=tel],input[type=search],input:not([type]),select,textarea{border:1px solid var(--border);border-radius:8px;padding:7px 9px;background:#fff;min-height:34px;width:100%}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid #93c5fd;outline-offset:0;border-color:#93c5fd}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* header */
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--brand);color:#fff;position:sticky;top:0;z-index:20;flex-wrap:wrap}
.top h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.2px}
.top .logo{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,#f59e0b,#c2410c);display:grid;place-items:center;font-weight:800;color:#fff;font-size:14px}
.top .lock{font-size:12px;background:rgba(255,255,255,.14);padding:3px 9px;border-radius:999px}
.top .save{font-size:12px;opacity:.85}
.top button{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.25)}
.top button:hover{background:rgba(255,255,255,.2)}
.menu{position:relative}
.menu-pop{position:absolute;right:0;top:40px;background:#fff;color:var(--ink);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);min-width:230px;padding:6px;z-index:30}
.menu-pop button{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--ink)}
.menu-pop button:hover{background:#f1f5f9}

.layout{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 52px)}
aside{border-right:1px solid var(--border);background:#fff;padding:12px;overflow:auto;max-height:calc(100vh - 52px);position:sticky;top:52px}
main{padding:16px 20px 60px;min-width:0}
.side-h{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 4px 6px;font-weight:650}
.biz{display:block;width:100%;text-align:left;border:1px solid transparent;border-radius:9px;padding:8px 10px;margin-bottom:4px;background:transparent}
.biz:hover{background:#f8fafc}
.biz.sel{background:#eff6ff;border-color:#bfdbfe}
.biz .bn{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.biz .bm{font-size:12px;color:var(--muted)}
.stagebar{display:flex;height:6px;border-radius:4px;overflow:hidden;background:#e5e7eb;margin-top:5px}
.stagebar i{display:block;height:100%}
.stagebar .s-app{background:var(--st-app)}.stagebar .s-impl{background:var(--st-impl)}.stagebar .s-mc{background:var(--st-mc)}
.mobile-biz{display:none}

/* business header */
.bizhead{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);margin-bottom:12px}
.bizhead h2{margin:0 0 4px;font-size:20px}
.overview{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:10px}
.stat{border:1px solid var(--border);border-radius:9px;padding:9px 11px;background:#fbfcfd}
.stat .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stat .v{font-size:19px;font-weight:700;margin-top:2px}
.stat .d{font-size:12px;color:var(--muted)}
.pipeline{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.pipe{flex:1;min-width:150px;border-radius:9px;padding:8px 10px;border:1px solid}
.pipe .n{font-size:20px;font-weight:700}
.pipe.st-app{background:var(--st-app-bg);border-color:#fcd34d;color:#78350f}
.pipe.st-impl{background:var(--st-impl-bg);border-color:#93c5fd;color:#1e3a8a}
.pipe.st-mc{background:var(--st-mc-bg);border-color:#6ee7b7;color:#064e3b}

/* tabs/toolbar */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin:6px 0 12px;overflow-x:auto}
.tab{border:0;border-bottom:3px solid transparent;border-radius:0;background:transparent;padding:9px 12px;color:var(--muted);font-weight:600;white-space:nowrap}
.tab.on{color:var(--brand);border-bottom-color:var(--brand)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.toolbar input[type=search]{max-width:280px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:9px;overflow:hidden;background:#fff}
.seg button{border:0;border-radius:0;border-right:1px solid var(--border);background:#fff;font-size:13px}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--brand);color:#fff}

/* badges */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:650;padding:2px 8px;border-radius:999px;white-space:nowrap}
.badge.st-app{background:var(--st-app-bg);color:#92400e}
.badge.st-impl{background:var(--st-impl-bg);color:#1e40af}
.badge.st-mc{background:var(--st-mc-bg);color:#065f46}
.badge.lvl-parent{background:#e0e7ff;color:#3730a3}
.badge.lvl-child{background:#fce7f3;color:#9d174d}
.badge.lvl-inh{background:#f1f5f9;color:#475569;border:1px dashed #94a3b8}
.badge.own{background:var(--own-bg);color:var(--own)}
.badge.up{background:var(--up-bg);color:var(--up)}
.badge.sample{background:#fff7ed;color:#9a3412;border:1px solid #fed7aa}
.steps{display:inline-flex;gap:3px;vertical-align:middle}
.steps i{width:16px;height:5px;border-radius:3px;background:#e5e7eb;display:block}
.st-app .steps i.on{background:var(--st-app)}.st-impl .steps i.on{background:var(--st-impl)}.st-mc .steps i.on{background:var(--st-mc)}

/* org chart */
.chartwrap{background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow:auto;box-shadow:var(--shadow);-webkit-overflow-scrolling:touch}
.tree{display:inline-block;min-width:100%;padding:18px 10px 26px;text-align:center}
.tree ul{display:flex;justify-content:center;margin:0;padding:22px 0 0;position:relative}
.tree li{list-style:none;position:relative;padding:22px 7px 0;display:flex;flex-direction:column;align-items:center}
.tree li::before,.tree li::after{content:'';position:absolute;top:0;right:50%;border-top:2px solid var(--line);width:50%;height:22px}
.tree li::after{right:auto;left:50%;border-left:2px solid var(--line)}
.tree li:only-child::before,.tree li:only-child::after{display:none}
.tree li:only-child{padding-top:0}
.tree li:first-child::before,.tree li:last-child::after{border:0 none}
.tree li:last-child::before{border-right:2px solid var(--line);border-radius:0 7px 0 0}
.tree li:first-child::after{border-radius:7px 0 0 0}
.tree ul ul::before{content:'';position:absolute;top:0;left:50%;border-left:2px solid var(--line);height:22px}
.tree>ul{padding-top:0}
.node{width:232px;text-align:left;background:#fff;border:1px solid var(--border);border-top:5px solid #94a3b8;border-radius:10px;padding:9px 10px;box-shadow:var(--shadow);cursor:pointer;position:relative}
.node:hover{box-shadow:0 0 0 2px #bfdbfe,var(--shadow)}
.node.st-app{border-top-color:var(--st-app)}.node.st-impl{border-top-color:var(--st-impl)}.node.st-mc{border-top-color:var(--st-mc)}
.node.root{width:260px;border-width:2px;border-top-width:6px}
.node.dim{opacity:.35}
.node.hit{box-shadow:0 0 0 3px #fde047,var(--shadow)}
.node-top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.node-name{font-weight:650;margin:6px 0 2px;line-height:1.25;word-break:break-word}
.node-meta{font-size:11.5px;color:var(--muted);word-break:break-all}
.node-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.chip{font-size:11px;background:#f1f5f9;color:#334155;border-radius:6px;padding:2px 6px;white-space:nowrap}
.chip.own{background:var(--own-bg);color:var(--own);font-weight:600}
.chip.up{background:var(--up-bg);color:var(--up)}
.chip.link{background:#ecfeff;color:#155e75;border:1px dashed #67e8f9}
.node-actions{display:flex;gap:4px;margin-top:8px}
.node-actions button{flex:1}
.lvl-tag{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
/* outline */
.outline{padding:12px 14px}
.outline ul{list-style:none;margin:0;padding-left:26px;position:relative}
.outline>ul{padding-left:0}
.outline li{position:relative;padding:5px 0}
.outline ul ul li::before{content:'';position:absolute;left:-16px;top:0;bottom:50%;width:14px;border-left:2px solid var(--line);border-bottom:2px solid var(--line);border-bottom-left-radius:6px}
.outline ul ul li:not(:last-child)::after{content:'';position:absolute;left:-16px;top:50%;bottom:0;border-left:2px solid var(--line)}
.outline .node{width:auto;max-width:720px;display:grid;grid-template-columns:1fr auto;gap:4px 10px}
.outline .node .node-actions{grid-column:2;grid-row:1/span 3;flex-direction:column;margin:0}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:8px 2px}
.legend span{display:inline-flex;gap:5px;align-items:center}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}

/* tables */
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:15px}
.tblwrap{overflow:auto;border:1px solid var(--border);border-radius:var(--radius);background:#fff;-webkit-overflow-scrolling:touch}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th{position:sticky;top:0;background:#f8fafc;text-align:left;font-weight:650;color:#334155;border-bottom:1px solid var(--border);padding:8px;white-space:nowrap;z-index:1}
table.t td{border-bottom:1px solid #f1f5f9;padding:7px 8px;vertical-align:top}
table.t tr:hover td{background:#fafcff}
td.cc{cursor:copy}
td.cc:hover{background:#eff6ff!important}
.indent{display:inline-block}
.matrix td.c{text-align:center;font-size:15px}
.dot-direct{color:#3730a3}.dot-inh{color:#94a3b8}.dot-child{color:#9d174d}

/* contacts */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.contact{border:1px solid var(--border);border-radius:10px;padding:10px;background:#fff;border-left:5px solid #a5b4fc}
.contact.lvl-child{border-left-color:#f9a8d4}
.contact.inh{border-left-style:dashed;background:#fbfcfd}
.contact .cn{font-weight:650}
.contact .cl{font-size:12.5px;color:#334155;display:flex;align-items:center;gap:4px;justify-content:space-between}
.group-h{display:flex;align-items:center;gap:8px;margin:14px 0 8px;font-weight:650}

/* billing */
.rollup{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:10px;background:#fff;border-left:5px solid var(--own)}
.rollup .rl{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;display:flex;justify-content:flex-end}
.modal-card{background:#fff;width:min(640px,100%);height:100%;overflow:auto;padding:0 0 40px;box-shadow:-10px 0 30px rgba(0,0,0,.15);-webkit-overflow-scrolling:touch}
.modal.center{justify-content:center;align-items:center}
.modal.center .modal-card{height:auto;max-height:90vh;border-radius:12px;width:min(900px,96vw)}
.mh{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--border);padding:12px 16px;display:flex;gap:8px;align-items:center;z-index:2}
.mh h3{margin:0;font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mb{padding:12px 16px}
.sec{border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:12px}
.sec>h4{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:#475569;display:flex;align-items:center;gap:8px}
.f{display:grid;grid-template-columns:150px 1fr auto;gap:6px;align-items:center;margin-bottom:6px}
.f label{font-size:12.5px;color:#475569}
.stepper{display:flex;gap:0;margin:4px 0}
.stepper button{flex:1;border-radius:0;border-right-width:0;font-size:12.5px;padding:8px 6px}
.stepper button:first-child{border-radius:8px 0 0 8px}
.stepper button:last-child{border-radius:0 8px 8px 0;border-right-width:1px}
.stepper button.on.st-app,.stepper button.done.st-app{background:var(--st-app);color:#fff;border-color:var(--st-app)}
.stepper button.on.st-impl,.stepper button.done.st-impl{background:var(--st-impl);color:#fff;border-color:var(--st-impl)}
.stepper button.on.st-mc{background:var(--st-mc);color:#fff;border-color:var(--st-mc)}
.stepper button.done{opacity:.55}
.radio-cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.radio-cards label{border:1px solid var(--border);border-radius:9px;padding:9px;cursor:pointer;display:flex;gap:8px;align-items:flex-start}
.radio-cards label.on{border-color:var(--brand2);background:#eff6ff}
.filelist .fi{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #f1f5f9}
.filelist .fi .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.checklist{max-height:220px;overflow:auto;border:1px solid var(--border);border-radius:8px;padding:6px}
.checklist label{display:flex;gap:8px;padding:4px;align-items:center}

#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#111827;color:#fff;padding:9px 14px;border-radius:9px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:80;max-width:90vw}
#toast.show{opacity:1}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty h2{color:var(--ink)}
.warnbar{background:#fef3c7;border:1px solid #fcd34d;color:#78350f;padding:8px 12px;border-radius:9px;margin-bottom:10px;font-size:13px}
.okbar{background:#ecfdf5;border:1px solid #6ee7b7;color:#065f46;padding:8px 12px;border-radius:9px;margin-bottom:10px;font-size:13px}
.maptbl select{min-width:190px}
.kbd{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:#f1f5f9;padding:1px 5px;border-radius:4px}
pre.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:#f8fafc;border:1px solid var(--border);border-radius:8px;padding:8px;white-space:pre-wrap;max-height:200px;overflow:auto}

@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  aside{display:none}
  .mobile-biz{display:flex;gap:8px;margin-bottom:10px}
  main{padding:12px}
  .f{grid-template-columns:1fr auto}
  .f label{grid-column:1/-1}
  .radio-cards{grid-template-columns:1fr}
}
@media print{.top,aside,.tabs,.toolbar,.node-actions{display:none!important}.layout{display:block}}
.btnlike{display:inline-block}
.btnlike .button{display:inline-flex;align-items:center;cursor:pointer;border:1px solid var(--border);background:#fff;border-radius:8px;padding:7px 12px;min-height:34px}
.btnlike .button:hover{background:#f8fafc}
.privacy{background:#ecfdf5;color:#065f46;border-bottom:1px solid #a7f3d0;padding:6px 16px;font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lockscreen{position:fixed;inset:0;z-index:90;background:linear-gradient(160deg,#0f243d,#1e3a5f 55%,#2f5d8a);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.lockscreen.dialog{z-index:95;background:rgba(15,23,42,.55)}
.lock-card{background:#fff;border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.3);padding:22px;width:min(420px,100%)}
.lock-card label{display:block;margin:10px 0}
.lock-card label input{margin-top:4px}
.lock-err{color:#b91c1c;font-size:13px;min-height:18px;margin:4px 0 8px}
.lock-note{margin-top:14px;font-size:12px;color:#475569;background:#f8fafc;border:1px solid var(--border);border-radius:9px;padding:9px;line-height:1.45}
body.locked .top,body.locked .privacy,body.locked .layout,body.locked #storeWarn{display:none!important}
.lock-card .logo{border-radius:9px;background:linear-gradient(135deg,#f59e0b,#c2410c);display:grid;place-items:center;font-weight:800;color:#fff}
.lock-card label input{display:block;width:100%}
</style>
</head>
<body>
<header class="top">
  <div class="logo">AM</div><h1>Account Mapper</h1>
  <span class="lock" title="All data is stored only in this browser">🔒 Local only</span>
  <span class="save" id="saveState"></span>
  <span class="spacer"></span>
  <button data-act="locknow" title="Lock the app now">🔒 Lock</button>
  <button data-act="exportws" title="Save everything to a .json file">⬇ Export workspace</button>
  <button data-act="importws" title="Open a workspace .json file">⬆ Open workspace file</button>
  <div class="menu"><button data-act="menu" aria-label="More">☰</button>
    <div class="menu-pop hidden" id="menuPop">
      <button data-act="settings">Settings & passcode</button>
      <button data-act="loadsample">Load sample (fictional demo data)</button>
      <button data-act="about">About & privacy</button>
      <button data-act="clearall" style="color:#b91c1c">Erase everything in this browser…</button>
    </div></div>
</header>
<div class="privacy" id="privacyNote">🔒 <b>Your data stays in this browser. Nothing is uploaded.</b> <span>Share a business with another rep by exporting the workspace file.</span></div>
<div class="warnbar hidden" id="storeWarn" style="margin:8px 16px 0">This browser blocked full local storage, so uploaded files are kept only until you close the tab. Export your workspace before leaving.</div>
<div class="layout"><aside id="side"></aside><main><div class="mobile-biz" id="mobileBiz"></div><div id="main"></div></main></div>
<div id="modal" class="modal hidden"><div class="modal-card" id="modalCard"></div></div>
<div id="lockScreen" class="lockscreen hidden"></div>
<div id="pwDialog" class="lockscreen dialog hidden"></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileWs" accept=".json,application/json" class="hidden">
<script>
'use strict';
/* =====================================================================
   Account Mapper — local-only, single-file app.
   No network access except the optional, read-only Salesforce connection:
   the page CSP sets default-src 'none' and limits connect-src to Wex's
   Salesforce hosts. All data lives in this
   browser (IndexedDB, with localStorage fallback) and in files you export.
   ===================================================================== */
const APP_VERSION = '1.1.0';
const WS_FORMAT = 'account-mapper-workspace';

const STAGES = [
  {id:'app',  label:'Application Follow-up', short:'App Follow-up', n:1},
  {id:'impl', label:'Implementation Call',   short:'Impl. Call',   n:2},
  {id:'mc',   label:'Monitor & Control',     short:'Monitor & Control', n:3},
];
const STAGE = Object.fromEntries(STAGES.map(s=>[s.id,s]));

const ACCOUNT_FIELDS = [
  {k:'name',        label:'Business Name'},
  {k:'sfId',        label:'Salesforce Account ID'},
  {k:'caseNo',      label:'Case #'},
  {k:'oppName',     label:'Opportunity Name'},
  {k:'oppNo',       label:'Opportunity #'},

function ab2b64(buf){ const b = new Uint8Array(buf); let s = ''; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); }

/* ---------- CSV ---------- */
function detectDelim(text){
  const line = text.split(/\r?\n/).find(l => l.trim()) || '';
  let inQ = false; const c = {',':0,'\t':0,';':0,'|':0};
  for (const ch of line){ if (ch === '"') inQ = !inQ; else if (!inQ && ch in c) c[ch]++; }
  if (c['\t'] > 0) return '\t';
  let best = ',', bn = 0; for (const k in c) if (c[k] > bn){ bn = c[k]; best = k; }
  return best;
}
function parseCSV(text, delim){
  text = String(text || '').replace(/^\uFEFF/, '');
  delim = delim || detectDelim(text);
  const rows = []; let row = [], f = '', i = 0, q = false; const n = text.length;
  while (i < n){
    const ch = text[i];
    if (q){
      if (ch === '"'){ if (text[i+1] === '"'){ f += '"'; i += 2; continue; } q = false; i++; continue; }
      f += ch; i++; continue;
    }
    if (ch === '"' && f === ''){ q = true; i++; continue; }
    if (ch === delim){ row.push(f); f = ''; i++; continue; }
    if (ch === '\r'){ i++; continue; }
    if (ch === '\n'){ row.push(f); rows.push(row); row = []; f = ''; i++; continue; }
    f += ch; i++;
  }
  if (f !== '' || row.length){ row.push(f); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim() !== ''));
}
function csvCell(v){ const s = String(v ?? ''); return /[",\r\n]/.test(s) || /^\s|\s$/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }

function tsvCell(v){ return String(v ?? '').replace(/[\t\r\n]+/g, ' '); }
function toTSV(rows){ return rows.map(r => r.map(tsvCell).join('\t')).join('\n'); }
/* Salesforce report exports add footer lines (totals, "Generated By", copyright). Drop them. */
function cleanReportRows(rows){
  if (!rows.length) return rows;
  const w = rows[0].length;
  let out = rows.slice();
  while (out.length > 1){
    const r = out[out.length - 1]; const filled = r.filter(c => String(c).trim()).length;
    const txt = r.join(' ');
    if (/copyright|salesforce\.com|confidential information|generated by|^\s*total\b|grand total/i.test(txt) || (w > 2 && filled <= 1)) out.pop(); else break;
  }
  return out;
}

/* ---------- ZIP (store, no compression) ---------- */
const CRC_TABLE = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++){ let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u8){ let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
const enc = new TextEncoder();
function makeZip(files){
  const d = new Date();
  const dosTime = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const dosDate = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  const parts = [], central = []; let offset = 0;
  for (const f of files){
    const name = enc.encode(f.name);
    const data = typeof f.data === 'string' ? enc.encode(f.data) : new Uint8Array(f.data);
    const crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, dosTime, true); lh.setUint16(12, dosDate, true); lh.setUint32(14, crc, true);
    lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), name, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
    ch.setUint16(12, dosTime, true); ch.setUint16(14, dosDate, true); ch.setUint32(16, crc, true);
    ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, name.length, true);
    ch.setUint16(30, 0, true); ch.setUint16(32, 0, true); ch.setUint16(34, 0, true); ch.setUint16(36, 0, true); ch.setUint32(38, 0, true); ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + data.length;
  }
  const cdSize = central.reduce((a, b) => a + b.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)], {type: 'application/zip'});
}

/* ---------- XLSX writer (hand-written SpreadsheetML in a zip) ---------- */
const XML_BAD = /[\u0000-\u0008\u000B\u000C\u000E-\u001F\uFFFE\uFFFF]/g;
const xesc = s => String(s ?? '').replace(XML_BAD, '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function colName(i){ let s = ''; i++; while (i > 0){ const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; }
const NUM_RE = /^-?(0|[1-9]\d{0,14})(\.\d+)?$/;   // leading-zero values (IDs, ZIPs, card #s) stay text
function sheetName(raw, used){
  let s = String(raw || 'Sheet').replace(/[\[\]:*?\/\\]/g, ' ').replace(/\s+/g, ' ').trim().replace(/^'+|'+$/g, '');
  if (!s || /^history$/i.test(s)) s = 'Sheet';

  while (used.has(name.toLowerCase())){ const suf = ' (' + n++ + ')'; name = s.slice(0, 31 - suf.length).trim() + suf; }
  used.add(name.toLowerCase());

}

/* ---------- Vault: passcode-derived encryption (WebCrypto) ----------
   PBKDF2-SHA256 (600k iterations, random 16-byte salt) -> 512 bits.
   First 256 bits = AES-GCM-256 key (non-extractable). SHA-256 of the last
   256 bits = verifier stored in the lock record (the passcode itself is never stored).
   Every stored record is AES-GCM encrypted with a fresh 96-bit IV. */
const Vault = {
  key: null, meta: null, ITER: 600000,
  rand(n){ const a = new Uint8Array(n); crypto.getRandomValues(a); return a; },
  async derive(pass, saltB64, iter){
    const base = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveBits']);
    const bits = new Uint8Array(await crypto.subtle.deriveBits({name: 'PBKDF2', salt: new Uint8Array(b642ab(saltB64)), iterations: iter, hash: 'SHA-256'}, base, 512));
    const key = await crypto.subtle.importKey('raw', bits.slice(0, 32), {name: 'AES-GCM'}, false, ['encrypt', 'decrypt']);
    const ver = ab2b64(await crypto.subtle.digest('SHA-256', bits.slice(32)));
    bits.fill(0);
    return {key, ver};
  },
  same(a, b){ a = String(a); b = String(b); if (a.length !== b.length) return false; let d = 0; for (let i = 0; i < a.length; i++) d |= a.charCodeAt(i) ^ b.charCodeAt(i); return d === 0; },
  async encrypt(u8, key = this.key){ if (!key) throw new Error('locked'); const iv = this.rand(12); const ct = await crypto.subtle.encrypt({name: 'AES-GCM', iv}, key, u8); return {enc: 1, iv: ab2b64(iv), ct}; },
  async decrypt(r, key = this.key){ if (!key) throw new Error('locked'); const ct = typeof r.ct === 'string' ? b642ab(r.ct) : r.ct; return crypto.subtle.decrypt({name: 'AES-GCM', iv: new Uint8Array(b642ab(r.iv))}, key, ct); },
  async encryptStr(s, key){ return this.encrypt(enc.encode(s), key); },
  async encryptData(d, key){ const isStr = typeof d === 'string'; const r = await this.encrypt(isStr ? enc.encode(d) : new Uint8Array(d), key); r.t = isStr ? 's' : 'b'; return r; },
  async decryptData(r, key){ const buf = await this.decrypt(r, key); return r.t === 's' ? new TextDecoder().decode(buf) : buf; },
};

/* ---------- Storage (IndexedDB, localStorage fallback). Data records are always encrypted. ---------- */
const Store = {
  db: null, mode: 'idb', mem: new Map(),
  async open(){
    try {
      if (!window.indexedDB) throw new Error('no idb');
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('account-mapper', 1);
        r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv'); if (!d.objectStoreNames.contains('files')) d.createObjectStore('files'); };
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error('blocked'));
      });
    } catch (e) { this.mode = 'local'; }
  },
  _tx(store, mode, fn){
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode); const req = fn(t.objectStore(store));
      t.oncomplete = () => res(req ? req.result : undefined); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('aborted'));
    });
  },
  _ls(v){ if (v && v.enc && typeof v.ct !== 'string') return {...v, ct: ab2b64(v.ct)}; return v; },
  async rawGet(store, key){ if (this.mode === 'idb') return this._tx(store, 'readonly', s => s.get(key)); if (store === 'kv'){ try { const t = localStorage.getItem('am_' + key); return t ? JSON.parse(t) : undefined; } catch (e) { return undefined; } } return this.mem.get(key); },
  async rawPut(store, key, val){ if (this.mode === 'idb') return this._tx(store, 'readwrite', s => s.put(val, key)); if (store === 'kv') localStorage.setItem('am_' + key, JSON.stringify(this._ls(val))); else this.mem.set(key, val); },
  async rawDel(store, key){ if (this.mode === 'idb') return this._tx(store, 'readwrite', s => s.delete(key)); if (store === 'kv') localStorage.removeItem('am_' + key); else this.mem.delete(key); },
  async fileKeys(){ if (this.mode === 'idb') return this._tx('files', 'readonly', s => s.getAllKeys()); return [...this.mem.keys()]; },
  /* atomic multi-write (one IndexedDB transaction) — used for migration and passcode change */
  async putMany(kv, files, wipeFiles){
    if (this.mode !== 'idb'){ if (wipeFiles) this.mem.clear(); for (const k in kv) await this.rawPut('kv', k, kv[k]); for (const k in files) this.mem.set(k, files[k]); return; }
    return new Promise((res, rej) => {
      const t = this.db.transaction(['kv', 'files'], 'readwrite'); const ks = t.objectStore('kv'), fs = t.objectStore('files');
      if (wipeFiles) fs.clear();
      for (const k in kv) ks.put(kv[k], k); for (const k in files) fs.put(files[k], k);
      t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('aborted'));
    });
  },
  async getWs(){ const r = await this.rawGet('kv', 'ws'); if (!r) return null; if (r.enc) return JSON.parse(new TextDecoder().decode(await Vault.decrypt(r))); return r; },
  async putWs(ws){ return this.rawPut('kv', 'ws', await Vault.encryptStr(JSON.stringify(ws))); },
  async getFile(id){ const r = await this.rawGet('files', id); if (r == null) return r; return r.enc ? Vault.decryptData(r) : r; },

function tableFromText(text){
  text = String(text || '').replace(/^\uFEFF/, '');
  const lines = text.split(/\r?\n/);
  const first = lines.find(l => l.trim()) || '';
  const delim = detectDelim(text);
  const firstCols = parseCSV(first, delim)[0] || [];
  if (firstCols.length >= 3 || !looksKV(lines)){
    const rows = cleanReportRows(parseCSV(text, delim));
    return {headers: rows[0] || [], rows: rows.slice(1)};
  }
  // "Label: value" or "Label<TAB>value" blocks; blank line separates records
  const recs = []; let cur = null; const headers = [];
  for (const raw of lines){
    const l = raw.trim();
    if (!l){ cur = null; continue; }
    const m = l.match(/^([^:\t]{1,60})(?::\s*|\t+)(.*)$/);
    if (!m) continue;
    const k = m[1].trim(), v = m[2].trim();
    if (!cur){ cur = {}; recs.push(cur); }
    if (k in cur){ cur = {}; recs.push(cur); }
    cur[k] = v; if (!headers.includes(k)) headers.push(k);

  if (recs.length) return {headers, rows: recs.map(r => headers.map(h => r[h] ?? ''))};

}

async function addFiles(accountId, fileList){

    const isCsv = /\.(csv|tsv|txt)$/i.test(file.name) || /csv|tab-separated/.test(file.type);
    const meta = {id: uid('file'), accountId, name: file.name, mime: file.type || '', size: file.size, added: Date.now(), kind: isCsv ? 'csv' : 'other'};
    if (isCsv){ const text = await file.text(); const rows = parseCSV(text); meta.rows = Math.max(0, rows.length - 1); meta.cols = (rows[0] || []).length; await Store.putFile(meta.id, text); }
    else await Store.putFile(meta.id, await file.arrayBuffer());
    WS.files.push(meta); n++;
  }
  touch(); toast(n + ' file(s) added — stored in this browser only');
}

  const billing = billingMatrix(b).map((r, i) => i && parseMoney(r[6]) != null ? r.map((v, j) => j === 6 ? {v: parseMoney(v), s: 3, t: 'n'} : j === 1 || j === 5 ? {v, t: 's'} : v) : r);

/* A column is numeric only if every value is a plain number with no leading zero; otherwise the whole column is text (keeps IDs, card #s, ZIPs intact). */
function typeColumns(rows){
  const w = Math.max(0, ...rows.map(r => r.length)); const numeric = [];
  for (let c = 0; c < w; c++){ let any = false, ok = true; for (const r of rows.slice(1)){ const v = String(r[c] ?? '').trim(); if (!v) continue; any = true; if (!NUM_RE.test(v)){ ok = false; break; } } numeric[c] = any && ok; }
  return rows.map((r, i) => r.map((v, c) => i === 0 ? v : {v, t: numeric[c] ? 'n' : 's'}));
}

async function buildMasterZip(b){

  const files = sheets.filter(s => !s.isFile).map((s, i) => ({name: String(i + 1).padStart(2, '0') + '_' + safeFile(s.name) + '.csv', data: '\uFEFF' + toCSV(plain(s.rows))}));

  for (const {a} of tree(b.id)) for (const f of filesOf(a.id)) if (f.kind !== 'csv'){ const d = await Store.getFile(f.id); if (d) files.push({name: 'attachments/' + safeFile(shortName(a, b)) + '__' + safeFile(f.name), data: d}); }
  download(makeZip(files), safeFile(b.name) + '_master_csvs_' + today() + '.zip');
  toast('Zip built: ' + files.length + ' files');
}

/* ===================== Optional: Salesforce (read-only) adapter =====================
   OFF until a Wex Salesforce admin provides a Connected App / External Client App
   Consumer Key. OAuth 2.0 Authorization Code + PKCE (no client secret, no passwords
   ever typed into this app). Read-only: only SOQL GET queries; it never writes to
   Salesforce and never sends data anywhere else. The access token lives in
   sessionStorage only (gone when the tab closes) and is never exported.
   The page CSP only allows these Salesforce hosts in connect-src. */
const SF_DEFAULT_INSTANCE = 'https://wexinc.my.salesforce.com';
const SF_API = 'v61.0';
const SF_HOST_RE = /^https:\/\/[a-z0-9-]+(\.[a-z0-9-]+)*\.(my\.salesforce\.com|force\.com)$|^https:\/\/(login|test)\.salesforce\.com$/i;
const SF = {
  cfg(){ let c = {}; try { c = JSON.parse(localStorage.getItem('am_sf') || '{}'); } catch (e) {} return {instanceUrl: c.instanceUrl || SF_DEFAULT_INSTANCE, clientId: c.clientId || ''}; },
  saveCfg(c){ localStorage.setItem('am_sf', JSON.stringify({instanceUrl: c.instanceUrl, clientId: c.clientId})); },
  tok(){ try { return JSON.parse(sessionStorage.getItem('am_sf_tok') || 'null'); } catch (e) { return null; } },
  callback(){ return location.origin + location.pathname; },
  canRedirect(){ return /^https?:$/.test(location.protocol); },
  cleanUrl(u){ return String(u || '').trim().replace(/\/+$/, ''); },
  status: '', busy: false,
  async connect(){
    const c = SF.cfg();
    if (!SF_HOST_RE.test(c.instanceUrl)){ toast('Instance URL must be a Salesforce address, e.g. ' + SF_DEFAULT_INSTANCE); return; }
    if (!c.clientId){ toast('Enter the Consumer Key from your Salesforce admin first'); return; }
    if (!SF.canRedirect()){ toast('Connect works from the hosted site or installed app, not a file opened from disk'); return; }
    const rnd = n => { const a = new Uint8Array(n); crypto.getRandomValues(a); return Array.from(a, b => ('0' + b.toString(16)).slice(-2)).join(''); };
    const verifier = rnd(48), state = rnd(16);
    const dig = new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
    const challenge = btoa(String.fromCharCode(...dig)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    sessionStorage.setItem('am_sf_pkce', JSON.stringify({verifier, state, instanceUrl: c.instanceUrl, clientId: c.clientId, redirect: SF.callback()}));
    const q = new URLSearchParams({response_type: 'code', client_id: c.clientId, redirect_uri: SF.callback(), code_challenge: challenge, code_challenge_method: 'S256', state, scope: 'api'});
    location.assign(c.instanceUrl + '/services/oauth2/authorize?' + q.toString());
  },
  pending: null,
  /* called at page load (before unlock): take the OAuth response out of the address bar */
  capture(){ const p = new URLSearchParams(location.search); if (p.has('code') || p.has('error')){ SF.pending = p; history.replaceState(null, '', location.pathname); } },
  /* called after the app is unlocked */
  async handleRedirect(){
    const p = SF.pending; if (!p) return; SF.pending = null;
    const pk = JSON.parse(sessionStorage.getItem('am_sf_pkce') || 'null');
    sessionStorage.removeItem('am_sf_pkce');
    UI.tab = 'import';
    if (p.has('error')){ SF.status = 'Salesforce sign-in was not completed: ' + (p.get('error_description') || p.get('error')); return; }
    if (!pk || pk.state !== p.get('state')){ SF.status = 'Sign-in response did not match this browser session; try Connect again.'; return; }
    try {
      const body = new URLSearchParams({grant_type: 'authorization_code', code: p.get('code'), client_id: pk.clientId, redirect_uri: pk.redirect, code_verifier: pk.verifier});
      const r = await fetch(pk.instanceUrl + '/services/oauth2/token', {method: 'POST', headers: {'Content-Type': 'application/x-www-form-urlencoded'}, body, credentials: 'omit', referrerPolicy: 'no-referrer'});
      const j = await r.json().catch(() => ({}));
      if (!r.ok || !j.access_token) throw new Error(j.error_description || j.error || ('HTTP ' + r.status));
      const inst = SF.cleanUrl(j.instance_url || pk.instanceUrl);
      if (!SF_HOST_RE.test(inst)) throw new Error('Unexpected Salesforce address ' + inst);
      sessionStorage.setItem('am_sf_tok', JSON.stringify({access: j.access_token, instanceUrl: inst, at: Date.now()}));
      SF.status = 'Connected to ' + inst + ' (read-only, this tab only).';
    } catch (e) { SF.status = 'Could not finish Salesforce sign-in: ' + e.message + '. If this says “Failed to fetch”, CORS is probably not enabled yet (see the admin checklist).'; }
  },
  disconnect(){ sessionStorage.removeItem('am_sf_tok'); SF.status = 'Disconnected.'; render(); },
  async query(soql){
    const t = SF.tok(); if (!t) throw new Error('Not connected');
    let url = t.instanceUrl + '/services/data/' + SF_API + '/query?q=' + encodeURIComponent(soql); const out = [];
    for (let i = 0; url && i < 20; i++){
      const r = await fetch(url, {headers: {Authorization: 'Bearer ' + t.access, Accept: 'application/json'}, credentials: 'omit', referrerPolicy: 'no-referrer'});
      if (r.status === 401){ sessionStorage.removeItem('am_sf_tok'); throw new Error('Salesforce session expired — connect again'); }
      const j = await r.json(); if (!r.ok) throw new Error((j[0] && j[0].message) || ('HTTP ' + r.status));
      out.push(...j.records); url = j.nextRecordsUrl ? t.instanceUrl + j.nextRecordsUrl : null;
    }
    return out;
  },
  /* Pull one business: the account (by ID or exact name), up to 4 levels of children, their contacts, latest case & opportunity. */
  async pullBusiness(ref){
    ref = String(ref || '').trim(); if (!ref) throw new Error('Enter an Account ID or exact account name');
    const lit = s => "'" + String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'") + "'";
    const where = /^[a-zA-Z0-9]{15}([a-zA-Z0-9]{3})?$/.test(ref) ? 'Id = ' + lit(ref) : 'Name = ' + lit(ref);
    const top = await SF.query('SELECT Id FROM Account WHERE ' + where + ' LIMIT 2');
    if (!top.length) throw new Error('No account found for "' + ref + '"');
    if (top.length > 1) throw new Error('More than one account is named "' + ref + '" — use the Account ID');
    const rid = lit(top[0].Id);
    const accts = await SF.query('SELECT Id, Name, ParentId, Owner.Name, Owner.Email, Owner.Phone FROM Account WHERE Id = ' + rid + ' OR ParentId = ' + rid + ' OR Parent.ParentId = ' + rid + ' OR Parent.Parent.ParentId = ' + rid + ' OR Parent.Parent.Parent.ParentId = ' + rid + ' LIMIT 2000');
    const ids = accts.map(a => lit(a.Id)).join(',');
    const [cons, cases, opps] = await Promise.all([
      SF.query('SELECT Id, Name, Title, Email, Phone, AccountId FROM Contact WHERE AccountId IN (' + ids + ') LIMIT 5000'),
      SF.query('SELECT CaseNumber, AccountId FROM Case WHERE AccountId IN (' + ids + ') ORDER BY CreatedDate DESC LIMIT 2000').catch(() => []),
      SF.query('SELECT Id, Name, AccountId FROM Opportunity WHERE AccountId IN (' + ids + ') ORDER BY CreatedDate DESC LIMIT 2000').catch(() => [])]);
    const first = (list, id) => list.find(x => x.AccountId === id);
    const recs = accts.map(a => { const c = first(cases, a.Id), o = first(opps, a.Id); const r = {name: a.Name, sfId: a.Id};
      if (a.ParentId && a.Id !== top[0].Id) r.parentRef = a.ParentId; if (a.Owner){ if (a.Owner.Name) r.repName = a.Owner.Name; if (a.Owner.Email) r.repEmail = a.Owner.Email; if (a.Owner.Phone) r.repPhone = a.Owner.Phone; }
      if (c) r.caseNo = c.CaseNumber; if (o){ r.oppName = o.Name; r.oppId = o.Id; } return r; });
    // parents first so children can resolve parentRef
    const depth = r => { let d = 0, x = r; while (x && x.parentRef && d < 6){ x = recs.find(y => y.sfId === x.parentRef); d++; } return d; };
    recs.sort((a, b) => depth(a) - depth(b));
    const ra = applyImport('accounts', recs);
    const rc = applyImport('contacts', cons.map(c => ({name: c.Name, title: c.Title || '', email: c.Email || '', phone: c.Phone || '', accountRef: c.AccountId})));
    const root = findAccount(top[0].Id); if (root) UI.biz = rootOf(root).id;
    touch();
    return 'Pulled ' + accts.length + ' account(s) (' + ra.created + ' new, ' + ra.updated + ' updated) and ' + cons.length + ' contact(s) from Salesforce.';
  },
};
DataSources.register({id: 'salesforce-api', label: 'Salesforce (read-only, OAuth + PKCE)', kind: 'remote', connect: SF.connect, pull: SF.pullBusiness});

/* ===================== Passcode lock ===================== */
const LOCK_NOTE = 'The passcode encrypts the data saved on this device. Because this is a public web page, it can’t stop anyone from opening the page itself — but without the passcode they can’t see or read any of your data.';
const Lock = {
  locked: true, lastActive: Date.now(), timer: null,
  defaults(){ return {autoLockMin: 15, encExport: true}; },
  async loadMeta(){ const m = await Store.rawGet('kv', 'lock'); return m && m.salt && m.ver ? {...Lock.defaults(), ...m} : null; },
  async saveMeta(m){ Vault.meta = m; await Store.rawPut('kv', 'lock', m); },
  fails(){ try { return JSON.parse(localStorage.getItem('am_fail') || '{"n":0,"until":0}'); } catch (e) { return {n: 0, until: 0}; } },
  setFails(f){ localStorage.setItem('am_fail', JSON.stringify(f)); },
  validNew(a, b){ if (String(a).length < 6) return 'Use at least 6 characters.'; if (a !== b) return 'The two passcodes don’t match.'; return ''; },

  show(mode, msg){
    Lock.locked = true; document.body.classList.add('locked');
    const el = $('#lockScreen'); el.classList.remove('hidden');
    let h = '<div class="lock-card"><div class="row" style="justify-content:center;margin-bottom:6px"><div class="logo" style="width:40px;height:40px;font-size:17px">AM</div></div><h2 style="text-align:center;margin:4px 0 2px">Account Mapper</h2>';
    if (mode === 'setup'){
      h += '<p class="muted small" style="text-align:center">Create a passcode for this browser. You’ll need it every time you open the app.</p>'
        + (Lock.legacy ? '<div class="warnbar">Existing data was found in this browser. It will be encrypted with this passcode.</div>' : '')
        + '<form novalidate id="lockForm" data-mode="setup" autocomplete="off"><label class="small">New passcode<input type="password" id="lp1" autocomplete="new-password" required minlength="6"></label><label class="small">Type it again<input type="password" id="lp2" autocomplete="new-password" required></label>'
        + '<div class="lock-err" id="lockErr">' + esc(msg || '') + '</div><button class="primary" style="width:100%" type="submit">Set passcode & open</button></form>'
        + '<p class="small muted">There is no recovery: if you forget it, the only option is to erase this browser’s data. Export backups regularly.</p>';
    } else if (mode === 'forgot'){
      h += '<div class="warnbar"><b>Forgot your passcode?</b> There is no backdoor and no reset. The only option is to <b>permanently erase</b> every account, contact and file stored in this browser. Anything not exported to a workspace file is lost.</div>'
        + '<form novalidate id="lockForm" data-mode="erase"><label class="small">Type <b>ERASE</b> to confirm<input id="eraseTxt" autocomplete="off"></label><div class="lock-err" id="lockErr">' + esc(msg || '') + '</div>'
        + '<div class="row"><button type="button" data-lock="back">Back</button><span class="spacer"></span><button class="danger" type="submit" id="eraseBtn">Erase this browser’s data</button></div></form>';
    } else {
      h += '<p class="muted small" style="text-align:center">Locked. Enter your passcode to continue.</p>'
        + '<form novalidate id="lockForm" data-mode="unlock"><input type="text" name="username" autocomplete="username" value="Account Mapper" class="hidden" readonly><label class="small">Passcode<input type="password" id="lp1" autocomplete="current-password" required autofocus></label>'
        + '<div class="lock-err" id="lockErr">' + esc(msg || '') + '</div><button class="primary" style="width:100%" type="submit" id="unlockBtn">Unlock</button></form>'
        + '<p style="text-align:center"><a href="#" data-lock="forgot" class="small">Forgot passcode?</a></p>';
    }
    h += '<div class="lock-note">🔒 <b>Your data stays in this browser. Nothing is uploaded.</b><br>' + esc(LOCK_NOTE) + '</div></div>';
    el.innerHTML = h;
    setTimeout(() => { const i = $('#lp1') || $('#eraseTxt'); if (i) i.focus(); }, 30);
  },

  async onSubmit(ev){
    ev.preventDefault();
    const f = ev.target, mode = f.dataset.mode, err = m => { $('#lockErr').textContent = m; };
    const btn = f.querySelector('button[type=submit]'); const label = btn.textContent;
    const busy = on => { btn.disabled = on; btn.textContent = on ? 'Working…' : label; };
    try {
      if (mode === 'setup'){
        const a = $('#lp1').value, b = $('#lp2').value; const bad = Lock.validNew(a, b); if (bad) return err(bad);
        busy(true); await Lock.setup(a); busy(false); await Lock.opened();
      } else if (mode === 'unlock'){
        const fl = Lock.fails(); const wait = Math.ceil((fl.until - Date.now()) / 1000);
        if (wait > 0) return err('Too many wrong tries. Wait ' + wait + ' s and try again.');
        busy(true); const ok = await Lock.unlock($('#lp1').value); busy(false);
        if (!ok){ const n = fl.n + 1; const until = n >= 5 ? Date.now() + Math.min(900, 30 * 2 ** (n - 5)) * 1000 : 0; Lock.setFails({n, until}); $('#lp1').value = ''; $('#lp1').focus(); return err('Wrong passcode.' + (n >= 5 ? ' Locked for ' + Math.round((until - Date.now()) / 1000) + ' s.' : '')); }
        Lock.setFails({n: 0, until: 0}); await Lock.opened();
      } else if (mode === 'erase'){
        if ($('#eraseTxt').value.trim() !== 'ERASE') return err('Type ERASE (capital letters) to confirm.');
        busy(true); await Store.clearAll(false); localStorage.removeItem('am_fail'); sessionStorage.removeItem('am_sf_tok'); Vault.meta = null; Vault.key = null; Lock.legacy = false; busy(false);
        Lock.show('setup', 'All data in this browser was erased. Set a new passcode to start fresh.');
      }
    } catch (e) { busy(false); console.warn(e); err('Something went wrong: ' + e.message); }
  },

  /* first passcode: create lock record and encrypt any existing (legacy, unencrypted) data in one transaction */
  async setup(pass){
    const salt = ab2b64(Vault.rand(16)); const {key, ver} = await Vault.derive(pass, salt, Vault.ITER);
    const plainWs = await Store.rawGet('kv', 'ws');
    const ws = plainWs && !plainWs.enc ? migrate(plainWs) : blankWs();
    const files = {};
    for (const id of await Store.fileKeys()){ const r = await Store.rawGet('files', id); if (r != null && !r.enc) files[id] = await Vault.encryptData(r, key); }
    const meta = {...Lock.defaults(), v: 1, kdf: 'PBKDF2-SHA256', iter: Vault.ITER, salt, ver, created: Date.now()};
    await Store.putMany({ws: await Vault.encryptStr(JSON.stringify(ws), key), lock: meta}, files, false);
    Vault.meta = meta; Vault.key = key; Lock.legacy = false;
  },
  async unlock(pass){
    const m = Vault.meta; const {key, ver} = await Vault.derive(pass, m.salt, m.iter);
    if (!Vault.same(ver, m.ver)) return false;
    Vault.key = key; return true;

  async opened(){

    const btn = $('#cpBtn'); btn.disabled = true; btn.textContent = 'Re-encrypting…';
    try {
      const chk = await Vault.derive(old, Vault.meta.salt, Vault.meta.iter);

      clearTimeout(saveTimer);

      UI.modal = {kind: 'preview', html: Lock.settingsHtml('Passcode changed. All saved data was re-encrypted with the new passcode.')}; renderModal();

  },

  /* ---- export / import encryption ---- */
  async sealExport(obj, pass){
    const salt = ab2b64(Vault.rand(16)); const {key} = await Vault.derive(pass, salt, Vault.ITER);
    const r = await Vault.encryptStr(JSON.stringify(obj), key);
    return {format: WS_FORMAT, encrypted: true, version: 1, note: 'Encrypted Account Mapper workspace. Open it in Account Mapper with its passcode.', kdf: {name: 'PBKDF2', hash: 'SHA-256', iter: Vault.ITER, salt}, cipher: 'AES-GCM', iv: r.iv, ct: ab2b64(r.ct)};
  },
  async openExport(j, pass){
    const {key} = await Vault.derive(pass, j.kdf.salt, j.kdf.iter);
    try { return JSON.parse(new TextDecoder().decode(await Vault.decrypt({iv: j.iv, ct: j.ct}, key))); } catch (e) { return null; }
  },
};

      + '</tbody></table></div><div class="row" style="margin-top:10px"><span class="spacer"></span><button class="primary" data-act="impgo" id="impGo">Import ' + I.plan.length + ' ' + I.type + '</button></div></div>';
  }
  if (I.result) h += '<div class="okbar">✓ Imported: ' + I.result.created + ' new, ' + I.result.updated + ' updated.' + (I.result.warnings.length ? '<br>⚠ ' + I.result.warnings.map(esc).join('<br>⚠ ') : '') + ' <button class="small" data-act="tab" data-tab="chart">View chart</button> <button class="small" data-act="impreset">New import</button></div>';
  return h;
}
function impRead(text, fileName){
  const I = UI.imp; I.text = text; I.fileName = fileName || '';
  const src = DataSources.get(fileName ? 'csv' : 'paste');
  const table = src.toTable(text);
  if (!table.headers.length || !table.rows.length){ toast('Could not find a header row and data rows'); return; }
  const w = table.headers.length; table.rows = table.rows.map(r => { const x = r.slice(0, w); while (x.length < w) x.push(''); return x; });
  // auto-detect contacts vs accounts if headers clearly look like contacts
  const hn = table.headers.map(norm);
  if (hn.some(h => /^(first name|last name|email|contact name|full name)$/.test(h)) && !hn.some(h => /^(parent account|case number|opportunity)/.test(h))) I.type = 'contacts';
  I.table = table; I.under = I.type === 'contacts' ? (UI.biz || '') : ''; I.map = guessMap(I.type, table.headers); I.step = 2; I.plan = null; I.result = null;
  render();
}

/* ---------- workspace file ---------- */
async function exportWs(){
  const files = [];
  for (const f of WS.files){ const d = await Store.getFile(f.id); if (d == null) continue; files.push(typeof d === 'string' ? {id: f.id, encoding: 'text', data: d} : {id: f.id, encoding: 'base64', data: ab2b64(d)}); }
  let out = {format: WS_FORMAT, version: 1, appVersion: APP_VERSION, exported: new Date().toISOString(), workspace: WS, fileData: files};
  let protectedFile = false;
  if (Vault.meta && Vault.meta.encExport){
    const pass = await Lock.ask({title: 'Protect this export', confirm: true, okLabel: 'Export', note: 'Choose a passcode for this file (it can differ from your app passcode). The rep who opens it will need it — share it separately, not with the file.'});
    if (pass == null){ toast('Export cancelled'); return; }
    toast('Encrypting…'); out = await Lock.sealExport(out, pass); protectedFile = true;
  }
  download(new Blob([JSON.stringify(out, null, protectedFile ? 0 : 1)], {type: 'application/json'}), 'account-mapper-workspace_' + today() + (protectedFile ? '_protected' : '') + '.json');
  toast(protectedFile ? 'Passcode-protected workspace exported' : 'Workspace exported (not passcode-protected) — keep this file private');
}
async function importWs(file){
  let j; try { j = JSON.parse(await file.text()); } catch (e) { toast('That file is not a workspace (.json)'); return; }
  if (j && j.format === WS_FORMAT && j.encrypted){
    let err = '', inner = null;
    for (;;){
      const pass = await Lock.ask({title: 'Open protected workspace', note: 'This file is passcode-protected. Enter the passcode the sender gave you.', error: err, okLabel: 'Open'});
      if (pass == null){ toast('Import cancelled'); return; }
      inner = await Lock.openExport(j, pass); if (inner) break; err = 'Wrong passcode for this file.';
    }
    j = inner;
  }
  if (!j || j.format !== WS_FORMAT || !j.workspace){ toast('That file is not an Account Mapper workspace'); return; }
  const merge = WS.accounts.length ? confirm('Merge this file into what you already have?\n\nOK = merge (matching accounts are kept, new ones added)\nCancel = choose replace') : false;
  if (!merge && WS.accounts.length && !confirm('Replace EVERYTHING in this browser with the file’s contents?')) return;
  const inc = migrate(j.workspace);
  const data = new Map((j.fileData || []).map(f => [f.id, f]));
  const putData = async id => { const f = data.get(id); if (!f) return; await Store.putFile(id, f.encoding === 'base64' ? b642ab(f.data) : f.data); };
  if (!merge){ await Store.clearAll(true); WS = inc; for (const f of WS.files) await putData(f.id); }
  else {
    const have = new Set(WS.accounts.map(a => a.id)); const haveC = new Set(WS.contacts.map(c => c.id)); const haveF = new Set(WS.files.map(f => f.id));
    for (const a of inc.accounts) if (!have.has(a.id)) WS.accounts.push(a);
    for (const c of inc.contacts) if (!haveC.has(c.id)) WS.contacts.push(c);
    for (const f of inc.files) if (!haveF.has(f.id)){ WS.files.push(f); await putData(f.id); }
  }
  UI.biz = null; touch(); toast('Workspace loaded');
}

  link: el => { const a = acc(el.dataset.id), b = acc($('#linkSel').value); if (!b) return; if (!a.linkedIds.includes(b.id)) a.linkedIds.push(b.id); if (!b.linkedIds.includes(a.id)) b.linkedIds.push(a.id); touch(); renderModal(); },

  delacct: el => {

  preview: el => previewFile(el.dataset.id),

/* ---------- events ---------- */
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (!el){ if (UI.menu && !ev.target.closest('.menu')){ UI.menu = false; renderMenu(); } if (ev.target.id === 'modal') closeOrBack(); return; }
  const f = ACT[el.dataset.act]; if (!f) return;
  if (el.tagName === 'A') ev.preventDefault();
  ev.stopPropagation();
  if (el.dataset.act === 'close'){ closeOrBack(); return; }
  f(el, ev);
});
function closeOrBack(){ if (UI.modal && UI.modal.kind === 'contact' && UI.backTo){ const c = con(UI.modal.id); if (c && !c.name && !c.email && !c.phone) WS.contacts = WS.contacts.filter(x => x !== c); touch(); backOrClose(); } else closeModal(); }
let bgTimer = null;
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.id === 'q' || t.id === 'q2'){ UI.q = t.value; const id = t.id, pos = t.selectionStart; render(); const n = $('#' + id); if (n){ n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} } return; }
  if (t.dataset.sf){ const c = SF.cfg(); c[t.dataset.sf] = t.dataset.sf === 'instanceUrl' ? SF.cleanUrl(t.value) : t.value.trim(); SF.saveCfg(c); const b = $('[data-act=sfconnect]'); if (b) b.disabled = !c.clientId; return; }

});
document.addEventListener('change', async ev => {
  const t = ev.target;
  if (t.dataset.upload){ if (t.files.length) await addFiles(t.dataset.upload, t.files); t.value = ''; renderModal(); return; }
  if (t.id === 'fileWs'){ if (t.files[0]) await importWs(t.files[0]); t.value = ''; return; }
  if (t.id === 'impFile'){ const f = t.files[0]; if (f) impRead(await f.text(), f.name); t.value = ''; return; }
  if (t.dataset.f === 'billCycle' && UI.modal){ const a = acc(UI.modal.id); a.billCycle = t.value; touch(); return; }
  const a = t.dataset.actChange; if (!a) return;
  if (a === 'autolock'){ Vault.meta.autoLockMin = +t.value; await Lock.saveMeta(Vault.meta); toast('Auto-lock after ' + t.value + ' min'); return; }
  if (a === 'encexport'){ Vault.meta.encExport = t.checked; await Lock.saveMeta(Vault.meta); toast(t.checked ? 'Exports will be passcode-protected' : 'Exports will NOT be passcode-protected'); return; }
  if (a === 'bizsel'){ UI.biz = t.value; render(); }
  if (a === 'setparent'){ const x = acc(t.dataset.id); const np = t.value || null; if (np && subtreeIds(x.id).has(np)){ toast('Can’t move an account under its own child'); renderModal(); return; } x.parentId = np; if (!np) x.billMode = 'own'; UI.biz = rootOf(x).id; touch(); renderModal(); }
  if (a === 'cacct'){ const c = con(UI.modal.id); const id = t.dataset.v; if (t.checked){ if (!c.accountIds.includes(id)) c.accountIds.push(id); } else c.accountIds = c.accountIds.filter(x => x !== id); touch(); }
  if (a === 'impmap'){ UI.imp.map[+t.dataset.v] = t.value; }
  if (a === 'impunder'){ UI.imp.under = t.value; }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && UI.modal) closeOrBack(); });

/* ---------- boot ---------- */
async function boot(){
  await Store.open();
  SF.capture();
  if (Store.mode !== 'idb') $('#storeWarn').classList.remove('hidden');
  Vault.meta = await Lock.loadMeta();
  if (!Vault.meta){ const legacy = await Store.rawGet('kv', 'ws'); Lock.legacy = !!(legacy && !legacy.enc && legacy.accounts && legacy.accounts.length); }
  Lock.show(Vault.meta ? 'unlock' : 'setup');
  Lock.start();
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  window.__ready = true;
}
boot();
